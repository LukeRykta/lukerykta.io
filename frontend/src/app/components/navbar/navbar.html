<header class="fixed inset-x-0 top-0 z-50 pointer-events-none">
    <nav class="text-white px-4 sm:px-6 lg:px-10 xl:px-12 py-3 flex items-center justify-between w-full pointer-events-auto">
        <!-- Left: Logo + Brand -->
        <a routerLink="/" class="flex items-center gap-3 min-w-0">
            <img
                    ngSrc="assets/icons/logo_transparent_v1.png"
                    width="585" height="585" alt="Luke Ryktarsyk logo"
                    class="brand-mark h-8 md:h-9 lg:h-10 w-auto object-contain"
                    priority=""
                    fetchpriority="high"
                    decoding="async"
            />
        </a>

        <!-- Desktop Nav Links -->
        <ul class="hidden md:flex gap-6 lg:gap-10">
            <li>
                <a routerLink="/"
                   routerLinkActive="is-active"
                   [routerLinkActiveOptions]="{ exact: true }"
                   [class.is-active]="isActive('/')"
                   class="nav-link">Home</a>
            </li>
            <li>
                <a routerLink="/projects"
                   routerLinkActive="is-active"
                   [routerLinkActiveOptions]="{ exact: true }"
                   [class.is-active]="isActive('/projects')"
                   class="nav-link">Projects</a>
            </li>
            <li>
                <a routerLink="/about"
                   routerLinkActive="is-active"
                   [routerLinkActiveOptions]="{ exact: true }"
                   [class.is-active]="isActive('/about')"
                   class="nav-link">About</a>
            </li>
            <li>
                <a routerLink="/oauth"
                   routerLinkActive="is-active"
                   [routerLinkActiveOptions]="{ exact: true }"
                   [class.is-active]="isActive('/oauth')"
                   class="nav-link">Auth</a>
            </li>
        </ul>

        <!-- Mobile Menu Button -->
        <button
                (click)="toggleMenu()"
                class="md:hidden focus:outline-none focus:ring-2 focus:ring-blue-500 rounded"
                aria-label="Toggle menu"
        >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none"
                 viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>
    </nav>

    @if (menuOpen) {
        <div class="mobile-menu md:hidden absolute top-full right-4 sm:right-6 py-2 space-y-3 pointer-events-auto">
            <a routerLink="/"
               routerLinkActive="is-active"
               [routerLinkActiveOptions]="{ exact: true }"
               [class.is-active]="isActive('/')"
               class="nav-link mobile-link">Home</a>
            <a routerLink="/projects"
               routerLinkActive="is-active"
               [routerLinkActiveOptions]="{ exact: true }"
               [class.is-active]="isActive('/projects')"
               class="nav-link mobile-link">Projects</a>
            <a routerLink="/about"
               routerLinkActive="is-active"
               [routerLinkActiveOptions]="{ exact: true }"
               [class.is-active]="isActive('/about')"
               class="nav-link mobile-link">About</a>
            <a routerLink="/oauth"
               routerLinkActive="is-active"
               [routerLinkActiveOptions]="{ exact: true }"
               [class.is-active]="isActive('/oauth')"
               class="nav-link mobile-link">Auth</a>
        </div>
    }
</header>
